version: "3"

# The lane's done check. `task check` is the whole thing: build, gate the .wasm, rule
# tests, then every golden trace on every engine.
#
# Browsers are a prerequisite, not part of the check (they are a 300 MB download):
#   cd tools/browser && npm ci && npx playwright install --with-deps chromium firefox webkit

vars:
  WASM: "{{.ROOT_DIR}}/build/sim.wasm"
  GOLDEN: "{{.ROOT_DIR}}/golden"

tasks:
  build:
    desc: build sim.wasm
    cmds:
      - cargo build -p sim-core --release --target wasm32-unknown-unknown
      - mkdir -p build
      - cp target/wasm32-unknown-unknown/release/sim_core.wasm {{.WASM}}

  wasm-gate:
    desc: sim.wasm must have no import and no relaxed-SIMD instruction
    deps: [build]
    cmds:
      - |
        wat=$(wasm-tools print {{.WASM}})
        if echo "$wat" | grep -E '^\s*\(import ' ; then echo "FAIL: sim.wasm has imports"; exit 1; fi
        if echo "$wat" | grep -E 'relaxed' ; then echo "FAIL: sim.wasm uses relaxed SIMD"; exit 1; fi
        echo "wasm-gate ok"

  test:
    desc: rule tests
    cmds:
      - cargo test

  golden:
    desc: every golden trace on Chrome, Firefox, WebKit, wazero compiler and wazero interpreter
    deps: [build]
    cmds:
      - cd tools/browser && npm ci --no-audit --no-fund
      # Both runners always run: a failure in one engine group must not hide the others.
      - |
        status=0
        (cd tools/browser && node runner.mjs --wasm {{.WASM}} --golden {{.GOLDEN}}) || status=1
        (cd tools/wazero && go run . --wasm {{.WASM}} --golden {{.GOLDEN}}) || status=1
        exit $status

  check:
    desc: the done check
    cmds:
      - task: wasm-gate
      - task: test
      - task: golden
